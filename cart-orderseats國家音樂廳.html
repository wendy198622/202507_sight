<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
	<title>縱觀藝術售票系統</title>
	<link rel="icon" href="logo.ico">

	<!-- css -->
	<link rel="stylesheet" type="text/css" href="css/reset.css" />
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.0.7/css/swiper.min.css" />
	<link rel="stylesheet" type="text/css" href="css/animate.css" />
	<link rel="stylesheet" type="text/css" href="css/cart-seat-nmc.css" />
	
    <!-- js -->
	<script src="js/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.0.7/js/swiper.min.js"></script>
    <script src="js/wow.min.js"></script>
	<script src="js/imgLiquid-min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>

<body>
	
	<header id="header"></header>

	<section>
		<div class="event_frame">
      <div class="container">
          <div class="event_info">
              <h4 class="event_info_name">《雙城脈動》薩克斯風音樂會</h4>
              <h4 class="event_info_en-name">《Echoes of Two Cities》Saxophone Concert by NIKITA ZIMIN and MATSUSHITA YO</h5>
          </div>
          <div class="event_info">
              <h4 class="event_info_date">時間：2025 年 12 月 31 日 (三)</h4>
              <h4 class="event_info_time">
                <span class="start">19:00</span><span class="line"></span><span class="end">21:00</span>
              </h4>
              <h4 class="event_info_place">地點：<span>國家音樂廳</span></h4>
          </div>
      </div>
    </div>
    <div class="event_seat">
      
      <!-- 座位地圖容器 -->
      <div id="seat-map-container">
          <div id="map-legend" style="opacity: 0; visibility: hidden;"></div>
          <div class="my-controls">
            <button id="zoom-in-btn" type="button" title="放大"><span class="material-icons">add</span></button>
            <button id="zoom-out-btn" type="button" title="縮小"><span class="material-icons">remove</span></button>
            <button id="reset-btn" type="button" title="重置"><span class="material-icons">replay</span></button>
          </div>
          
          <!-- Canvas 座位圖：改用 canvas 直接繪製座位幾何圖形，取代原本上千個節點的 SVG -->
          <canvas id="seats-photo"></canvas>
          </section>
    
    <footer id="footer"></footer>

    <!-- 購物車開關按鈕：面板預設隱藏，靠這顆浮動按鈕開啟/關閉 -->
    <button id="cart-toggle-btn" class="cart-toggle-btn" type="button" onclick="toggleSidebar()" title="購物車">
      <span class="material-icons">shopping_cart</span>
      <span id="cart-toggle-count" class="cart-toggle-count" style="display:none;">0</span>
    </button>

    <!-- 側邊欄 -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span>購物車</span>
        <span class="close-btn" onclick="toggleSidebar()">✖</span>
      </div>
      
      <div id="sidebar-content">
          <p style="text-align:center; color:#999; margin-top:50px;">尚未選擇座位</p>
      </div>

      <div class="sidebar-footer">
          <div class="total-row"><span>總金額</span><span class="total-price" id="total-price">NT$ 0</span></div>
          <button class="btn-checkout" id="btn-checkout" disabled onclick="alert('進入結帳流程...')">前往結帳</button>
      </div>
  </div>

    <script src="js/seatmap-nch-data.js"></script>
    <script>
      // --- 1. 票種定義 ---
      const ticketTypes = {
          "wheelchair": { name: "輪椅席", capacityStr: "14 席", price: 600, color: "#00A3E9", isSelectable: true, options: [{id: "std", name: "全票", price: 1200}, {id: "con", name: "優待票", price: 600}, {id: "stu", name: "學生票", price: 1000}] },
          "w_companion": { name: "輪椅陪同席", capacityStr: "14 席", price: 600, color: "#2167B7", isSelectable: true, options: [{id: "std", name: "全票", price: 1200}, {id: "con", name: "優待票", price: 600}, {id: "stu", name: "學生票", price: 1000}] },
          "friendly": { name: "多元友善席", capacityStr: "6 席", price: 900, color: "#92B03E", isSelectable: true, options: [{id: "std", name: "全票", price: 900}, {id: "dis", name: "身障優惠", price: 450}] },
          "f_companion": { name: "友善陪同席", capacityStr: "6 席", price: 900, color: "#C2DF74", isSelectable: true, options: [{id: "std", name: "全票", price: 900}] },
          "vip": { name: "貴賓席", capacityStr: "10 席", price: 2600, color: "#fe877b", isSelectable: true, options: [{id: "std", name: "全票", price: 1200}] },
          "price_2600": { name: "2,600 區", capacityStr: "", price: 2600, color: "#ffffff", stroke: "#fe877b", isSelectable: true, options: [{id: "std", name: "全票", price: 2600}] },
          "price_1800": { name: "1,800 區", capacityStr: "", price: 1800, color: "#ffffff", stroke: "#c381e1", isSelectable: true, options: [{id: "std", name: "全票", price: 1800}] },
          "price_1200": { name: "1,200 區", capacityStr: "", price: 1200, color: "#ffffff", stroke: "#3ba843", isSelectable: true, options: [{id: "std", name: "全票", price: 1200}] },
          "general": { name: "800 區", capacityStr: "", price: 800, color: "#ffffff", stroke: "#ccc", isSelectable: true, options: [ {id: "std", name: "全票", price: 800}, {id: "con", name: "優待票 (65歲以上)", price: 600}, {id: "stu", name: "學生票", price: 600} ] },
          "bad_view": { name: "視線不良席", capacityStr: "", price: 400, color: "#9D9D9D", isSelectable: true, options: [{id: "std", name: "視線不良席", price: 400}] },
          "bad_view_organ": { name: "管風琴視線不良席", capacityStr: "", price: 400, color: "#FCD5B4", isSelectable: true, options: [{id: "std", name: "管風琴視線不良席", price: 400}] },
          "work": { name: "工作席", capacityStr: "8 席", price: 0, color: "#FFD61E", isSelectable: false },
      };
  
      // --- 2. 批量座位配置 ---
      const seatTypeAssignments = {
          "work": [ "f2-r17-38", "f2-l17-39", "f2-r30-22", "f2-l30-21", "f3-r7-40", "f3-l7-41", "f4-r8-18", "f4-l8-19" ], 
          "wheelchair": [ "f2-r25-26", "f2-r25-28", "f2-l25-27", "f2-l25-29", "f2-r27-22", "f2-r27-38", "f2-l27-23", "f2-l27-39", "f2-l27-22", "f2-l27-38", "f2-l27-23", "f2-l27-39", "f2-m32-15", "f2-m32-16", "f2-r32-34", "f2-r32-36", "f2-l32-33", "f2-l32-35" ],
          "w_companion": [ "f2-r25-22", "f2-r25-24","f2-r25-30", "f2-r25-32","f2-l25-23", "f2-l25-25","f2-l25-31", "f2-l25-33", "f2-m32-14", "f2-r32-20", "f2-r32-22", "f2-m32-13", "f2-l32-19", "f2-l32-21" ], 
          "friendly": [ "f2-l10-37",  "f2-r10-38", "f2-m26-19", "f2-m26-20", "f2-m31-12", "f2-m31-13" ], 
          "f_companion": [ "f2-r10-36","f2-l10-35", "f2-m26-17", "f2-m26-18", "f2-m31-10", "f2-m31-11" ], 
          "bad_view": [ "f2-l27-25", "f2-l27-27", "f2-l27-29", "f2-l27-31", "f2-l27-33", "f2-l27-35", "f2-l27-37", "f2-l28-21", "f2-l28-23", "f2-l28-25", "f2-l28-27", "f2-l28-29", "f2-l28-31", "f2-l28-33", "f2-l28-35", "f2-l28-37",
                        "f2-r27-24", "f2-r27-26", "f2-r27-28", "f2-r27-30", "f2-r27-32", "f2-r27-34", "f2-r27-36", "f2-r28-22", "f2-r28-24", "f2-r28-26", "f2-r28-28", "f2-r28-30", "f2-r28-32", "f2-r28-34", "f2-r28-36", "f2-r28-38",
                        "f4-l1-5", "f4-l1-7", "f4-l2-7", "f4-l2-9", "f4-r1-6", "f4-r1-8", "f4-r2-8", "f4-r2-10", "f3-l2e-1", "f3-l2e-3", "f3-l2e-5", "f3-l2e-7", "f3-l2e-9", "f3-r2e-2", "f3-r2e-4", "f3-r2e-6", "f3-r2e-8", "f3-r2e-10", "f3-l1-9", "f3-r1-10",
                        ], 
          "bad_view_organ":[ "f2-l29-39", "f2-l30-37", "f2-l31-31", "f2-r29-38", "f2-r30-38", "f2-r31-30",
                             "f3-l10-25", "f3-l10-27", "f3-l11-25", "f3-l11-27", "f3-l11-29", "f3-l11-31", "f3-r10-26", "f3-r10-28", "f3-r11-26", "f3-r11-28", "f3-r11-30", "f3-r11-32", ],
          "vip": [ "f3-m10-1", "f3-m10-2", "f3-m10-3", "f3-m10-4", "f3-m10-5", "f3-m10-6", "f3-m10-7", "f3-m10-8", "f3-m10-9", "f3-m10-10", "f3-m11-1", "f3-m11-2", "f3-m11-3", "f3-m11-4", "f3-m11-5", "f3-m11-6", "f3-m11-7", "f3-m11-8", "f3-m11-9", "f3-m11-10" ], 
          "price_2600": [ "", "" ], 
          "price_1800": [ "", "" ], 
          "price_1200": [ "", "" ]
      };
  
      const defaultType = "general"; 
      const soldSeatsList = ["f2-rE1-32", "f2-rE1-30","f3-lA3-49","f3-lA3-47"];
  
      let seatConfig = {};
      const cart = new Map();
      let prevCartSize = 0;
      let zoneCounts = {};
  
      // ★★★ 修正 parseSeatId 支援 f1, f2, f3 ★★★
      function parseSeatId(seatId) {
          const parts = seatId.split('-');
          if (parts.length < 3) return seatId; 
          const floorMap = { 
              "f1": "一樓", "f2": "二樓", "f3": "三樓", "f4": "四樓"
          };
          const floorStr = floorMap[parts[0]] || parts[0]; 
          let rawRow = parts[1];
          let rowContent = rawRow.replace(/^[lrm]/i, '').toUpperCase();
          const rowStr = rowContent + "排"; 
          const numStr = parts[2] + "號"; 
          return `${floorStr} ${rowStr} ${numStr}`;
      }

      // --- 3. 座位資料（type / status / 幾何座標）---
      // SEAT_MAP_SEATS 裡每個座位的 x/y/w/h 已經是繪製用的方框座標（這個場館座位間距寬鬆，
      // 固定尺寸不會有座位重疊問題，不需要像衛武營那樣依鄰座間距縮放）。
      function generateConfig() {
          for (let key in ticketTypes) zoneCounts[key] = 0;

          SEAT_MAP_SEATS.forEach(g => {
              const id = g.id;
              let assignedType = defaultType;
              for (const [type, idList] of Object.entries(seatTypeAssignments)) {
                  if (idList.includes(id)) { assignedType = type; break; }
              }
              if (zoneCounts[assignedType] !== undefined) zoneCounts[assignedType]++;
              const typeData = ticketTypes[assignedType];
              seatConfig[id] = {
                  type: assignedType,
                  color: typeData.color,
                  stroke: typeData.stroke,
                  isSelectable: typeData.isSelectable,
                  status: "available",
                  x: g.x, y: g.y, w: g.w, h: g.h
              };
          });

          soldSeatsList.forEach(id => {
              if (seatConfig[id]) seatConfig[id].status = "sold";
          });
      }
  
      function toggleSeat(id) {
          const config = seatConfig[id];
          if (!config.isSelectable) return;
          if (config.status === 'sold') { alert("此座位已售完！"); return; }
          if (cart.has(id)) {
              cart.delete(id);
          } else {
              const zoneData = ticketTypes[config.type];
              const defaultOptionId = zoneData.options[0].id;
              cart.set(id, defaultOptionId);
          }
          updateSidebar();
          drawSeatMap();
      }
  
      function updateSidebar() {
          const sidebar = document.getElementById('sidebar');
          const contentContainer = document.getElementById('sidebar-content');
          const totalPriceEl = document.getElementById('total-price');
          const checkoutBtn = document.getElementById('btn-checkout');
          const cartToggleCount = document.getElementById('cart-toggle-count');

          if (cart.size > 0) {
              // 只在「從空到有」時自動開啟，手機版關閉後不會因為再選座位而被強制彈回
              if (prevCartSize === 0) sidebar.classList.add('active');
              cartToggleCount.textContent = cart.size;
              cartToggleCount.style.display = 'flex';
          } else {
              sidebar.classList.remove('active');
              cartToggleCount.style.display = 'none';
          }
          prevCartSize = cart.size;

          contentContainer.innerHTML = "";
  
          let totalPrice = 0;
          let hasItems = false;
  
          for (const [typeKey, typeData] of Object.entries(ticketTypes)) {
              const totalCap = zoneCounts[typeKey] || 0;
              if (totalCap === 0) continue; 
  
              let soldCount = 0;
              for (const sid in seatConfig) {
                  if (seatConfig[sid].type === typeKey && seatConfig[sid].status === 'sold') soldCount++;
              }
              
              const selectedSeatsInZone = [];
              cart.forEach((ticketId, seatId) => {
                  if (seatConfig[seatId].type === typeKey) {
                      selectedSeatsInZone.push({ seatId, ticketId });
                  }
              });
  
              const remaining = totalCap - soldCount;
              if (selectedSeatsInZone.length > 0) hasItems = true;
  
              const zoneGroup = document.createElement('div');
              zoneGroup.className = 'zone-group';
  
              let legendStyle = "";
              if(typeData.color) legendStyle += `background:${typeData.color};`;
              if(typeData.stroke) legendStyle += `border:2px solid ${typeData.stroke};`;
              else if(!typeData.color) legendStyle += `background:#fff; border:1px solid #ccc;`;
  
              const headerHtml = `
                  <div class="zone-header">
                      <div style="display:flex; align-items:center;">
                          <span style="display:inline-block; width:12px; height:12px; margin-right:8px; border-radius:2px; ${legendStyle}"></span>
                          <span>${typeData.name}</span>
                      </div>
                      <span class="stat-count">剩餘座位：${remaining} </span>
                  </div>
              `;
              zoneGroup.innerHTML = headerHtml;
  
              const itemsContainer = document.createElement('div');
              itemsContainer.className = 'zone-items';
  
              if (selectedSeatsInZone.length > 0) {
                  selectedSeatsInZone.forEach(item => {
                      const seatId = item.seatId;
                      const ticketId = item.ticketId;
                      const seatFullName = parseSeatId(seatId);
                      
                      const currentOption = typeData.options.find(opt => opt.id === ticketId);
                      const currentPrice = currentOption ? currentOption.price : 0;
                      totalPrice += currentPrice;
  
                      const hasMultipleOptions = typeData.options && typeData.options.length > 1;
                      let optionsHtml = "";
                      if(hasMultipleOptions) {
                          typeData.options.forEach(opt => {
                              const selected = opt.id === ticketId ? "selected" : "";
                              optionsHtml += `<option value="${opt.id}" ${selected}>${opt.name}: $${opt.price}</option>`;
                          });
                      } else {
                          optionsHtml = `<span style="font-size:0.9em; color:#666; display:block; margin-top:5px;">${typeData.options[0].name}: $${typeData.options[0].price}</span>`;
                      }
  
                      const itemDiv = document.createElement('div');
                      itemDiv.className = 'cart-item';
                      const itemBorderStyle = typeData.color ? `border-left-color: ${typeData.color};` : `border-left-color: #ccc;`;
                      itemDiv.style.cssText = itemBorderStyle;
  
                      itemDiv.innerHTML = `
                          <div class="cart-item-header">
                              <span>${seatFullName}</span>
                              <span class="cart-item-remove" onclick="removeSeat('${seatId}')">✕ 移除</span>
                          </div>
                          ${hasMultipleOptions ? `<select class="ticket-select" onchange="changeTicketType('${seatId}', this.value)">${optionsHtml}</select>` : optionsHtml}
                      `;
                      itemsContainer.appendChild(itemDiv);
                  });
              } 
  
              zoneGroup.appendChild(itemsContainer);
              contentContainer.appendChild(zoneGroup);
          }
  
          totalPriceEl.textContent = "NT$ " + totalPrice.toLocaleString();
          checkoutBtn.disabled = !hasItems;
          syncCartToggleBtn();
      }

      // 面板開啟時先隱藏浮動開關鈕，避免和面板內的 ✖ 關閉鈕重疊
      function syncCartToggleBtn() {
          const isOpen = document.getElementById('sidebar').classList.contains('active');
          document.getElementById('cart-toggle-btn').style.display = isOpen ? 'none' : 'flex';
      }

      function renderLegend() {
          const container = document.getElementById('map-legend');
          let html = "";
          for(const [key, data] of Object.entries(ticketTypes)) {
              let style = "";
              if(data.color) style += `background:${data.color};`;
              if(data.stroke) style += `border:2px solid ${data.stroke};`;
              else if(!data.color) style += `background:#fff; border:1px solid #ccc;`; 
              const label = data.capacityStr ? `${data.name} ${data.capacityStr}` : data.name;
              html += `<div class="legend-item"><span class="legend-color" style="${style}"></span>${label}</div>`;
          }
          html += `<div class="legend-item"><span class="legend-color" style="background:#dcdcdc"></span>已售完</div>`;
          html += `<div class="legend-item"><span class="legend-color" style="border:2px solid red; background:#fffad9"></span>已選擇</div>`;
          container.innerHTML = html;
      }
  
      function changeTicketType(seatId, newType) { if (cart.has(seatId)) { cart.set(seatId, newType); updateSidebar(); } }
      function removeSeat(seatId) { if (cart.has(seatId)) toggleSeat(seatId); }
      function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); syncCartToggleBtn(); }

      // --- 4. Canvas 座位圖繪製引擎 ---
      // 座位數上千個，改用單一 canvas 直接畫幾何圖形取代大量 SVG DOM 節點，
      // 拖曳/縮放時只需重繪畫面，不必讓瀏覽器對上千個節點做佈局與事件比對。
      const CLASS_FILL = { st0: "#f1f1f1", st1: "#fc0", st3: "#231815", st4: "#c2c2c2", st5: "#b2b2b2" };
      const DEFAULT_DECOR_FILL = "#231815"; // 無 class 的裝飾路徑（如管風琴等標示文字），沿用 SVG 預設黑色系
      const SOLD_FILL = "#dcdcdc";
      const SELECTED_FILL = "#fffad9";
      const SELECTED_STROKE = "red";
      const SPECIAL_LABELS = { wheelchair: "輪椅席", w_companion: "輪陪席", friendly: "友善席", f_companion: "友陪席" };

      let canvas, ctx, mapContainer;
      let dpr = window.devicePixelRatio || 1;
      let view = { scale: 1, tx: 0, ty: 0 };
      const decorPath2Ds = SEAT_MAP_DECOR_PATHS.map(p => ({ path: new Path2D(p.d), cls: p.cls }));
      const decorPolyPath2Ds = SEAT_MAP_DECOR_POLYS.map(pg => {
          const path = new Path2D();
          pg.pts.forEach((pt, i) => { if (i === 0) path.moveTo(pt[0], pt[1]); else path.lineTo(pt[0], pt[1]); });
          path.closePath();
          return { path, cls: pg.cls };
      });

      function resizeCanvas() {
          dpr = window.devicePixelRatio || 1;
          const rect = mapContainer.getBoundingClientRect();
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';
      }

      function fitToContainer() {
          const rect = mapContainer.getBoundingClientRect();
          const scale = Math.min(rect.width / SEAT_MAP_VB.w, rect.height / SEAT_MAP_VB.h) * 0.95;
          view.scale = scale;
          view.tx = (rect.width - SEAT_MAP_VB.w * scale) / 2;
          view.ty = (rect.height - SEAT_MAP_VB.h * scale) / 2;
      }

      function drawSeatMap() {
          if (!ctx) return;
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
          ctx.translate(view.tx, view.ty);
          ctx.scale(view.scale, view.scale);

          // 舞台
          ctx.fillStyle = CLASS_FILL[SEAT_MAP_STAGE.cls] || "#ffcc00";
          ctx.fillRect(SEAT_MAP_STAGE.x, SEAT_MAP_STAGE.y, SEAT_MAP_STAGE.w, SEAT_MAP_STAGE.h);

          // 其他小型裝飾方塊
          SEAT_MAP_DECOR_RECTS.forEach(r => {
              ctx.fillStyle = CLASS_FILL[r.cls] || DEFAULT_DECOR_FILL;
              ctx.fillRect(r.x, r.y, r.w, r.h);
          });

          // 門、走道、排數標示、管風琴標示等背景裝飾（原 SVG 向量圖形，原樣重繪）
          decorPolyPath2Ds.forEach(p => {
              ctx.fillStyle = CLASS_FILL[p.cls] || DEFAULT_DECOR_FILL;
              ctx.fill(p.path);
          });
          decorPath2Ds.forEach(p => {
              ctx.fillStyle = CLASS_FILL[p.cls] || DEFAULT_DECOR_FILL;
              ctx.fill(p.path);
          });

          SEAT_MAP_DECOR_TEXTS.forEach(t => {
              ctx.fillStyle = DEFAULT_DECOR_FILL;
              ctx.font = "36px 'Noto Sans CJK TC', sans-serif";
              ctx.textAlign = "left";
              ctx.textBaseline = "alphabetic";
              ctx.fillText(t.text, t.x, t.y);
          });

          // 特殊席位分類標籤（輪椅席/輪陪席/友善席/友陪席）：同一排常交錯出現多個小群組，
          // 由左到右掃過整排、票種一換就重新標一次，才不會漏標或標錯組
          const rowGroups = {};
          for (const id in seatConfig) {
              const s = seatConfig[id];
              if (SPECIAL_LABELS[s.type]) {
                  const parts = id.split('-');
                  const rowKey = parts[0] + '-' + parts[1];
                  (rowGroups[rowKey] || (rowGroups[rowKey] = [])).push(s);
              }
          }
          // 標籤文字常常比同一排相鄰兩個小群組的間距還寬（例如輪椅席/輪陪席常常只隔一個座位），
          // 直接照座位位置畫會疊在一起看不清楚，所以量測文字寬度、彼此會撞到就往上疊到下一層
          ctx.font = "7px sans-serif";
          const labelAnchors = [];
          for (const rowKey in rowGroups) {
              const seatsInRow = rowGroups[rowKey].slice().sort((a, b) => a.x - b.x);
              let lastType = null;
              const laneEndX = [];
              seatsInRow.forEach(s => {
                  if (s.type !== lastType) {
                      const label = SPECIAL_LABELS[s.type];
                      const width = ctx.measureText(label).width;
                      let lane = 0;
                      while (laneEndX[lane] !== undefined && s.x < laneEndX[lane] + 2) lane++;
                      laneEndX[lane] = s.x + width;
                      labelAnchors.push({ x: s.x, y: s.y - lane * 8, label });
                      lastType = s.type;
                  }
              });
          }

          // 座位
          for (const id in seatConfig) {
              const s = seatConfig[id];
              let fill = s.color || "#fff";
              let stroke = s.stroke || null;
              let textColor = "#fff";

              if (s.status === 'sold') {
                  fill = SOLD_FILL;
                  stroke = null;
                  textColor = "#333";
              } else if (cart.has(id)) {
                  fill = SELECTED_FILL;
                  stroke = SELECTED_STROKE;
                  textColor = "#333";
              } else if (!s.color || s.color === "#ffffff") {
                  textColor = "#333";
              }

              ctx.fillStyle = fill;
              ctx.fillRect(s.x, s.y, s.w, s.h);
              if (stroke) {
                  ctx.strokeStyle = stroke;
                  ctx.lineWidth = 1.5 / view.scale;
                  ctx.strokeRect(s.x, s.y, s.w, s.h);
              } else if (!s.color) {
                  ctx.strokeStyle = "#ccc";
                  ctx.lineWidth = 1 / view.scale;
                  ctx.strokeRect(s.x, s.y, s.w, s.h);
              }

              // 縮放太小時數字會糊成一團，乾脆跳過不畫
              if (s.h * view.scale > 8) {
                  const num = id.split('-')[2];
                  ctx.fillStyle = textColor;
                  ctx.font = `${Math.min(s.h * 0.5, 12)}px sans-serif`;
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText(num, s.x + s.w / 2, s.y + s.h / 2);
              }
          }

          // 樓層分隔標示（如「2F」「3F」）：純文字標示，不是座位資料，不參與 hitTest，不能被點選
          SEAT_MAP_FLOOR_LABELS.forEach(fl => {
              if (fl.h * view.scale <= 8) return;
              const label = fl.id.split('-')[2];
              ctx.fillStyle = "#231815";
              ctx.font = `${Math.min(fl.h * 0.5, 12)}px sans-serif`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(label, fl.x + fl.w / 2, fl.y + fl.h / 2);
          });

          if (view.scale > 1.0) {
              ctx.font = "7px sans-serif";
              ctx.fillStyle = "#c0392b";
              ctx.textAlign = "left";
              ctx.textBaseline = "bottom";
              labelAnchors.forEach(a => ctx.fillText(a.label, a.x, a.y - 2));
          }

          ctx.restore();
      }

      function screenToWorld(px, py) {
          const rect = canvas.getBoundingClientRect();
          const cx = px - rect.left, cy = py - rect.top;
          return { x: (cx - view.tx) / view.scale, y: (cy - view.ty) / view.scale };
      }

      function hitTestSeat(worldX, worldY) {
          for (const id in seatConfig) {
              const s = seatConfig[id];
              if (worldX >= s.x && worldX <= s.x + s.w && worldY >= s.y && worldY <= s.y + s.h) return id;
          }
          return null;
      }

      function zoomAt(px, py, factor) {
          const rect = canvas.getBoundingClientRect();
          const cx = px - rect.left, cy = py - rect.top;
          const worldX = (cx - view.tx) / view.scale, worldY = (cy - view.ty) / view.scale;
          const minScale = Math.min(rect.width / SEAT_MAP_VB.w, rect.height / SEAT_MAP_VB.h) * 0.95;
          let newScale = view.scale * factor;
          newScale = Math.max(minScale, Math.min(newScale, minScale * 6));
          view.tx = cx - worldX * newScale;
          view.ty = cy - worldY * newScale;
          view.scale = newScale;
          requestAnimationFrame(drawSeatMap);
      }

      function touchDist(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
      }
      function touchMid(touches) {
          return { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 };
      }

      function bindSeatMapEvents() {
          let isPanning = false, panStart = null, panStartView = null, moved = false;

          canvas.addEventListener('mousedown', (e) => {
              isPanning = true; moved = false;
              panStart = { x: e.clientX, y: e.clientY };
              panStartView = { tx: view.tx, ty: view.ty };
          });
          window.addEventListener('mousemove', (e) => {
              if (!isPanning) return;
              const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
              if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
              view.tx = panStartView.tx + dx;
              view.ty = panStartView.ty + dy;
              requestAnimationFrame(drawSeatMap);
          });
          window.addEventListener('mouseup', (e) => {
              if (isPanning && !moved) {
                  const w = screenToWorld(e.clientX, e.clientY);
                  const id = hitTestSeat(w.x, w.y);
                  if (id) toggleSeat(id);
              }
              isPanning = false;
          });
          canvas.addEventListener('wheel', (e) => {
              e.preventDefault();
              zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
          }, { passive: false });

          let touchMode = null, lastTouchDist = 0, touchMoved = false;

          canvas.addEventListener('touchstart', (e) => {
              if (e.touches.length === 1) {
                  touchMode = 'pan'; touchMoved = false;
                  panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                  panStartView = { tx: view.tx, ty: view.ty };
              } else if (e.touches.length === 2) {
                  touchMode = 'zoom';
                  lastTouchDist = touchDist(e.touches);
              }
          }, { passive: false });

          canvas.addEventListener('touchmove', (e) => {
              e.preventDefault();
              if (touchMode === 'pan' && e.touches.length === 1) {
                  const dx = e.touches[0].clientX - panStart.x, dy = e.touches[0].clientY - panStart.y;
                  if (Math.abs(dx) + Math.abs(dy) > 4) touchMoved = true;
                  view.tx = panStartView.tx + dx;
                  view.ty = panStartView.ty + dy;
                  requestAnimationFrame(drawSeatMap);
              } else if (touchMode === 'zoom' && e.touches.length === 2) {
                  const dist = touchDist(e.touches);
                  const mid = touchMid(e.touches);
                  zoomAt(mid.x, mid.y, dist / lastTouchDist);
                  lastTouchDist = dist;
              }
          }, { passive: false });

          canvas.addEventListener('touchend', (e) => {
              if (touchMode === 'pan' && !touchMoved && e.changedTouches.length === 1) {
                  const t = e.changedTouches[0];
                  const w = screenToWorld(t.clientX, t.clientY);
                  const id = hitTestSeat(w.x, w.y);
                  if (id) toggleSeat(id);
              }
              if (e.touches.length === 0) touchMode = null;
          }, { passive: true });

          const zoomInBtn = document.getElementById('zoom-in-btn');
          if (zoomInBtn) zoomInBtn.addEventListener('click', (e) => {
              e.preventDefault();
              const rect = canvas.getBoundingClientRect();
              zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.25);
          });

          const zoomOutBtn = document.getElementById('zoom-out-btn');
          if (zoomOutBtn) zoomOutBtn.addEventListener('click', (e) => {
              e.preventDefault();
              const rect = canvas.getBoundingClientRect();
              zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.25);
          });

          const resetBtn = document.getElementById('reset-btn');
          if (resetBtn) resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              fitToContainer();
              requestAnimationFrame(drawSeatMap);
          });

          window.addEventListener('resize', () => {
              resizeCanvas();
              fitToContainer();
              requestAnimationFrame(drawSeatMap);
          });
      }

      function initSeatMap() {
          renderLegend();
          generateConfig();
          updateSidebar();

          canvas = document.getElementById('seats-photo');
          ctx = canvas.getContext('2d');
          mapContainer = document.getElementById('seat-map-container');

          bindSeatMapEvents();

          // 延遲一小段時間再量測容器尺寸，避免頁首/頁尾非同步載入導致版面還沒穩定
          setTimeout(() => {
              resizeCanvas();
              fitToContainer();
              drawSeatMap();
          }, 100);
      }

      window.addEventListener('DOMContentLoaded', initSeatMap);
  </script>

</body>
<script>
	$(document).ready(function () {
		
		new WOW().init();

		// $(".imgLiquidFill").imgLiquid({fill:true});

		$('#header').load('page/header.html');
		$('#footer').load('page/footer.html');

		$(window).on("scroll", function() {
			if ($(window).scrollTop() > 100) {
				$("#header").addClass("fixed");
				// $(".logo").fadeIn(200);
			} else {
				$("#header").removeClass("fixed");
				// $(".logo").fadeOut(0);
			}
		});
		
		document.querySelectorAll('.quantity-selector').forEach(selector => {
            const minusBtn = selector.querySelector('.minus');
            const plusBtn = selector.querySelector('.plus');
            const quantitySpan = selector.querySelector('.quantity');

            minusBtn.addEventListener('click', () => {
                let quantity = parseInt(quantitySpan.textContent);
                if (quantity > 0) {
                    quantity--;
                    quantitySpan.textContent = quantity;
                }
            });

            plusBtn.addEventListener('click', () => {
                let quantity = parseInt(quantitySpan.textContent);
                // You can add a max limit if needed, e.g., if (quantity < 10)
                quantity++;
                quantitySpan.textContent = quantity;
            });
        });

        document.querySelectorAll('.price-zones button').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                document.querySelectorAll('.price-zones button').forEach(btn => btn.classList.remove('active'));
                // Add active class to the clicked button
                button.classList.add('active');
            });
        });

        // popup
        const popup = $('#seatingChartPopup');
        const openBtn = $('#openSeatingChartBtn');
        const closeBtn = $('.close-btn');

        openBtn.on('click', function() {
            popup.css('display', 'flex');
        });

        closeBtn.on('click', function() {
            popup.hide();
        });

        $(window).on('click', function(event) {
            if ($(event.target).is(popup)) {
                popup.hide();
            }
        });
	})
	
	//tab 切換
	window.addEventListener('DOMContentLoaded', () => {
		const hash = window.location.hash;
		if (hash) {
		const targetTab = document.querySelector(`input[type="radio"]${hash}`);
		if (targetTab) {
			targetTab.checked = true;
		}
		}
	});


</script>
