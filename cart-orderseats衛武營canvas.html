const defaultType = "general";
const soldSeatsList = ["f2-rE1-32", "f2-rE1-30","f3-lA3-49","f3-lA3-47"];

function parseSeatId(seatId) {
    const parts = seatId.split('-');
    if (parts.length < 3) return seatId;
    const floorMap = { "f1": "一樓", "f2": "二樓", "f3": "三樓", "f4": "四樓" };
    const floorStr = floorMap[parts[0]] || parts[0];
    let rawRow = parts[1];
    let rowContent = rawRow.replace(/^[lrm]/i, '').toUpperCase();
    return `${floorStr} ${rowContent}排 ${parts[2]}號`;
}

// --- 2. 建立座位資料表（type / status / 幾何位置）---
let seatConfig = {};
// 原始 SVG 裡「中間區塊」座位的路徑本來就比兩側小很多（設計稿如此，不是解析錯誤）。
// 這裡統一用固定尺寸繪製，並以每個座位原始的中心點對齊，讓畫面上大小、文字大小全部一致。
const SEAT_W = 24, SEAT_H = 21;
seatsGeometry.forEach(g => {
    let assignedType = defaultType;
    for (const [type, idList] of Object.entries(seatTypeAssignments)) {
        if (idList.includes(g.id)) { assignedType = type; break; }
    }
    const typeData = ticketTypes[assignedType];
    const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
    seatConfig[g.id] = {
        type: assignedType,
        color: typeData.color,
        stroke: typeData.stroke,
        isSelectable: typeData.isSelectable,
        status: soldSeatsList.includes(g.id) ? "sold" : "available",
        x: cx - SEAT_W / 2, y: cy - SEAT_H / 2, w: SEAT_W, h: SEAT_H
    };
});

const cart = new Map();

function renderLegend() {
    const container = document.getElementById('map-legend');
    let html = "";
    for (const [key, data] of Object.entries(ticketTypes)) {
        let style = "";
        if (data.color) style += `background:${data.color};`;
        if (data.stroke) style += `border:2px solid ${data.stroke};`;
        else if (!data.color) style += `background:#fff;border:1px solid #ccc;`;
        html += `<div class="legend-item"><span class="legend-color" style="${style}"></span>${data.name}</div>`;
    }
    html += `<div class="legend-item"><span class="legend-color" style="background:#dcdcdc"></span>已售完</div>`;
    html += `<div class="legend-item"><span class="legend-color" style="border:2px solid red;background:#fffad9"></span>已選擇</div>`;
    container.innerHTML = html;
}

function updateSidebar() {
    const contentContainer = document.getElementById('sidebar-content');
    const totalPriceEl = document.getElementById('total-price');
    const checkoutBtn = document.getElementById('btn-checkout');
    const drawer = document.getElementById('cart-drawer');
    const countBadge = document.getElementById('cartCount');

    let totalPrice = 0;
    let html = "";
    if (cart.size === 0) {
        html = `<p style="color:#999;font-size:13px;padding:10px 0;">尚未選擇座位，點擊座位圖上的座位開始選位。</p>`;
    } else {
        cart.forEach((_, seatId) => {
            const config = seatConfig[seatId];
            const typeData = ticketTypes[config.type];
            totalPrice += typeData.price;
            html += `
                <div class="cart-item" style="border-left-color:${typeData.color || '#ccc'};">
                    <span>${parseSeatId(seatId)}（${typeData.name}）</span>
                    <span class="cart-item-remove" onclick="removeSeat('${seatId}')">✕ 移除</span>
                </div>`;
        });
    }
    contentContainer.innerHTML = html;
    totalPriceEl.textContent = "NT$ " + totalPrice.toLocaleString();
    checkoutBtn.disabled = cart.size === 0;

    if (cart.size > 0) {
        countBadge.style.display = 'inline-block';
        countBadge.textContent = cart.size;
        drawer.classList.add('expanded'); // 選了座位就自動展開，讓清單「彈跳」出來
    } else {
        countBadge.style.display = 'none';
        drawer.classList.remove('expanded');
    }
}

document.getElementById('cartDrawerHandle').addEventListener('click', () => {
    const drawer = document.getElementById('cart-drawer');
    const chevron = document.getElementById('cartChevron');
    const willExpand = !drawer.classList.contains('expanded');
    drawer.classList.toggle('expanded', willExpand);
    chevron.textContent = willExpand ? '▼ 收合' : '▲ 展開';
});

function toggleSeat(id) {
    const config = seatConfig[id];
    if (!config.isSelectable) return;
    if (config.status === 'sold') { alert("此座位已售完！"); return; }
    if (cart.has(id)) cart.delete(id); else cart.set(id, true);
    updateSidebar();
    draw();
}
function removeSeat(seatId) { if (cart.has(seatId)) { cart.delete(seatId); updateSidebar(); draw(); } }

// --- 3. Canvas 繪製引擎 ---
const canvas = document.getElementById('seatCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('seat-map-container');

const VB_W = 2588, VB_H = 2509; // 對應原本 SVG 的 viewBox

let view = { scale: 1, tx: 0, ty: 0 };
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
}

function fitToContainer() {
    const rect = container.getBoundingClientRect();
    const scale = Math.min(rect.width / VB_W, rect.height / VB_H) * 0.95;
    view.scale = scale;
    view.tx = (rect.width - VB_W * scale) / 2;
    view.ty = (rect.height - VB_H * scale) / 2;
}

let lastDrawMs = 0, frameCount = 0, lastFpsTime = performance.now(), fps = 0;

function draw() {
    const t0 = performance.now();
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

    ctx.translate(view.tx, view.ty);
    ctx.scale(view.scale, view.scale);

    // 舞台示意
    ctx.fillStyle = "#ffd61e";
    ctx.fillRect(VB_W/2 - 260, 20, 520, 70);
    ctx.fillStyle = "#333";
    ctx.font = "28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("舞台", VB_W/2, 65);

    // 特殊席位分類標籤（輪椅席/輪陪席/友善席/友陪席）：同一排裡這幾種票種常常是交錯出現、
    // 分成好幾個不連續的小群組，所以改成「由左到右掃過整排，票種一換就重新標一次」，
    // 這樣不管一排裡有幾個交錯的小群組，每一群都會拿到正確對應的標籤，不會漏標或標錯組。
    const specialLabels = { wheelchair: '輪椅席', w_companion: '輪陪席', friendly: '友善席', f_companion: '友陪席' };
    const rowGroups = {};
    for (const id in seatConfig) {
        const s = seatConfig[id];
        if (specialLabels[s.type]) {
            const parts = id.split('-');
            const rowKey = parts[0] + '-' + parts[1]; // 只用「樓層-排」分組，不分票種，才能偵測交錯
            if (!rowGroups[rowKey]) rowGroups[rowKey] = [];
            rowGroups[rowKey].push(s);
        }
    }
    const labelAnchors = [];
    for (const rowKey in rowGroups) {
        const seatsInRow = rowGroups[rowKey].slice().sort((a, b) => a.x - b.x);
        let lastType = null;
        seatsInRow.forEach(s => {
            if (s.type !== lastType) {
                labelAnchors.push({ x: s.x, y: s.y, label: specialLabels[s.type] });
                lastType = s.type;
            }
        });
    }

    for (const id in seatConfig) {
        const s = seatConfig[id];
        let fill = s.color || "#fff";
        let stroke = s.stroke || null;
        let textColor = "#fff"; // 預設：有顏色的深色底配白字

        if (s.status === 'sold') {
            fill = "#dcdcdc";
            stroke = null;
            textColor = "#333";
        } else if (cart.has(id)) {
            fill = "#fffad9";
            stroke = "red";
            textColor = "#333"; // 選取後淺黃底，改用黑字才看得清楚
        } else if (!s.color || s.color === "#ffffff") {
            textColor = "#333"; // 白底票價分區也用黑字
        }

        ctx.fillStyle = fill;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1.5 / view.scale;
            ctx.strokeRect(s.x, s.y, s.w, s.h);
        } else if (!s.color) {
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 1 / view.scale;
            ctx.strokeRect(s.x, s.y, s.w, s.h);
        }

        // 依座位在螢幕上實際佔的像素大小決定要不要畫字，太小會糊成一團乾脆跳過
        const effectivePixelHeight = s.h * view.scale;
        if (effectivePixelHeight > 8) {
            const num = id.split('-')[2];
            ctx.fillStyle = textColor;
            ctx.font = `${Math.min(s.h*0.5, 12)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(num, s.x + s.w/2, s.y + s.h/2);
        }
    }

    // 縮放夠大時才畫分類標籤，避免縮到很小時文字疊在一起看不清楚
    if (view.scale > 1.0) {
        ctx.font = "9px sans-serif";
        ctx.fillStyle = "#c0392b";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        labelAnchors.forEach(a => {
            ctx.fillText(a.label, a.x, a.y - 2);
        });
    }

    ctx.restore();

    lastDrawMs = performance.now() - t0;
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 500) {
        fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
        frameCount = 0;
        lastFpsTime = now;
        document.getElementById('perfPanel').textContent =
            `FPS: ${fps} / draw: ${lastDrawMs.toFixed(1)} ms / 座位數: ${Object.keys(seatConfig).length}`;
    }
}

function screenToWorld(px, py) {
    const rect = canvas.getBoundingClientRect();
    const cx = px - rect.left, cy = py - rect.top;
    return { x: (cx - view.tx) / view.scale, y: (cy - view.ty) / view.scale };
}

function hitTest(worldX, worldY) {
    for (const id in seatConfig) {
        const s = seatConfig[id];
        if (worldX >= s.x && worldX <= s.x + s.w && worldY >= s.y && worldY <= s.y + s.h) {
            return id;
        }
    }
    return null;
}

function zoomAt(px, py, factor) {
    const rect = canvas.getBoundingClientRect();
    const cx = px - rect.left, cy = py - rect.top;
    const worldX = (cx - view.tx) / view.scale;
    const worldY = (cy - view.ty) / view.scale;
    let newScale = view.scale * factor;
    newScale = Math.max(0.15, Math.min(newScale, 6));
    view.tx = cx - worldX * newScale;
    view.ty = cy - worldY * newScale;
    view.scale = newScale;
    requestAnimationFrame(draw);
}

// --- 4. 事件綁定（滑鼠）---
let isPanning = false, panStart = null, panStartView = null, moved = false;

canvas.addEventListener('mousedown', (e) => {
    isPanning = true; moved = false;
    panStart = { x: e.clientX, y: e.clientY };
    panStartView = { tx: view.tx, ty: view.ty };
});
window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    view.tx = panStartView.tx + dx;
    view.ty = panStartView.ty + dy;
    requestAnimationFrame(draw);
});
window.addEventListener('mouseup', (e) => {
    if (isPanning && !moved) {
        const w = screenToWorld(e.clientX, e.clientY);
        const id = hitTest(w.x, w.y);
        if (id) toggleSeat(id);
    }
    isPanning = false;
});
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// --- 5. 事件綁定（觸控：單指拖曳、雙指縮放）---
let touchMode = null; // 'pan' | 'zoom'
let lastTouchDist = 0, lastTouchMid = null, touchMoved = false;

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        touchMode = 'pan'; touchMoved = false;
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panStartView = { tx: view.tx, ty: view.ty };
    } else if (e.touches.length === 2) {
        touchMode = 'zoom';
        lastTouchDist = touchDist(e.touches);
        lastTouchMid = touchMid(e.touches);
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault(); // 只在這個 canvas 上擋掉原生手勢，範圍精準、不影響頁面其他地方
    if (touchMode === 'pan' && e.touches.length === 1) {
        const dx = e.touches[0].clientX - panStart.x;
        const dy = e.touches[0].clientY - panStart.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) touchMoved = true;
        view.tx = panStartView.tx + dx;
        view.ty = panStartView.ty + dy;
        requestAnimationFrame(draw);
    } else if (touchMode === 'zoom' && e.touches.length === 2) {
        const dist = touchDist(e.touches);
        const mid = touchMid(e.touches);
        const factor = dist / lastTouchDist;
        zoomAt(mid.x, mid.y, factor);
        lastTouchDist = dist;
        lastTouchMid = mid;
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    if (touchMode === 'pan' && !touchMoved && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const w = screenToWorld(t.clientX, t.clientY);
        const id = hitTest(w.x, w.y);
        if (id) toggleSeat(id);
    }
    if (e.touches.length === 0) touchMode = null;
}, { passive: true });

function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
}
function touchMid(touches) {
    return { x: (touches[0].clientX + touches[1].clientX)/2, y: (touches[0].clientY + touches[1].clientY)/2 };
}

// --- 6. 控制按鈕 ---
document.getElementById('zoom-in-btn').addEventListener('click', () => {
    const rect = canvas.getBoundingClientRect();
    zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, 1.25);
});
document.getElementById('zoom-out-btn').addEventListener('click', () => {
    const rect = canvas.getBoundingClientRect();
    zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, 1/1.25);
});
document.getElementById('reset-btn').addEventListener('click', () => {
    fitToContainer();
    requestAnimationFrame(draw);
});

window.addEventListener('resize', () => {
    resizeCanvas();
    fitToContainer();
    requestAnimationFrame(draw);
});

// --- 7. 初始化 ---
renderLegend();
updateSidebar();
resizeCanvas();
fitToContainer();
draw();
</script>
</body>
</html>
